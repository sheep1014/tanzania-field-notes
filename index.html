<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2e9">
  <meta name="description" content="2026 年坦桑尼亚野生动物影像记录，按类群检索动物名称、所属科及生态习性。">
  <title>坦桑尼亚动物图鉴 · Tanzania Wildlife Catalogue</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#collection">跳至动物图鉴</a>
  <div class="page">
    <main>
      <h1 class="sr-only" id="page-title">坦桑尼亚动物图鉴</h1>
      <section class="collection" id="collection" aria-label="动物分类索引">
        <div class="browse-tools">
          <div class="filters" role="group" aria-label="按动物类别筛选">
            <button class="filter is-active" type="button" data-category="all" aria-pressed="true">全部 <span data-count="all">—</span></button>
            <button class="filter" type="button" data-category="mammal" aria-pressed="false">哺乳类 <span data-count="mammal">—</span></button>
            <button class="filter" type="button" data-category="bird" aria-pressed="false">鸟类 <span data-count="bird">—</span></button>
            <button class="filter" type="button" data-category="reptile" aria-pressed="false">爬行类 <span data-count="reptile">—</span></button>
          </div>
          <form class="search" role="search" id="search-form">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
            <label class="sr-only" for="search-input">搜索中文名、英文名或科名</label>
            <input type="search" id="search-input" placeholder="寻找一种动物…" autocomplete="off">
            <button id="clear-search" type="button" aria-label="清除搜索" hidden>×</button>
          </form>
        </div>
        <div class="collection-meta"><p id="result-status" role="status" aria-live="polite">正在载入观察记录…</p><span>点击照片 · 查看详情</span></div>
        <div class="animal-grid" id="animal-grid" aria-busy="true"></div>
        <div class="empty-state" id="empty-state" hidden><span class="empty-mark" aria-hidden="true">∅</span><h3 id="empty-title">未找到匹配条目</h3><p id="empty-description">请调整检索词或分类条件。</p><button type="button" id="reset-filters">查看全部条目 <span aria-hidden="true">↗</span></button></div>
        <noscript><p class="no-script">请启用 JavaScript 以浏览动物影像与分类资料。</p></noscript>
      </section>
    </main>
    <footer class="footer"><div class="footer-top"><span class="footer-title">记录与鉴定说明</span><span class="edition">TANZANIA / 2026</span></div><p>影像中的动物识别由 AI 辅助完成，仅作旅行记录，不作为专业鉴定依据。标记「待确认」的条目仍需核对；沙鸡的具体种类待确认。</p><div class="footer-bottom"><span>动物图鉴 · WILDLIFE CATALOGUE</span><a href="#page-title">回到页首 ↑</a></div></footer>
  </div>
  <dialog id="animal-dialog" aria-labelledby="detail-name" aria-describedby="detail-intro">
    <div class="dialog-top"><span id="detail-index" class="eyebrow"></span><button type="button" class="close-dialog" id="close-dialog" aria-label="关闭动物详情">关闭 <span aria-hidden="true">×</span></button></div>
    <div class="detail-layout">
      <div class="detail-gallery"><div class="detail-photo"><img id="detail-image" alt=""></div><div class="gallery-controls" id="gallery-controls"><button id="previous-image" type="button" aria-label="上一张照片">← <span>上一张</span></button><span id="image-count" role="status" aria-live="polite"></span><button id="next-image" type="button" aria-label="下一张照片"><span>下一张</span> →</button></div></div>
      <div class="detail-copy"><p class="eyebrow">IDENTIFICATION & ECOLOGY</p><h2 id="detail-name"></h2><p id="detail-en" class="detail-en"></p><div class="detail-tags"><span id="detail-family"></span><span id="detail-uncertain" class="uncertain" hidden>物种待确认</span></div><p id="detail-intro"></p><p id="detail-identification" class="identification" hidden>暂按照片特征识别，具体物种仍待确认。</p><p class="detail-footnote">影像记录地区：坦桑尼亚 · 2026</p></div>
    </div>
  </dialog>
</body>
</html>
